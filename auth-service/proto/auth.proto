syntax = "proto3";

package auth;

option go_package = "./pb"; 

// Определяем gRPC сервис
service AuthService {
  // Метод для получения UUID по токену
  rpc GetUUID (TokenRequest) returns (UUIDResponse);
}

// Запрос содержит JWT-токен
message TokenRequest {
  string token = 1;
}

// Ответ содержит UUID пользователя
message UUIDResponse {
  string uuid = 1;
}
