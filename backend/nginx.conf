worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream graph_backend {
        server graph_serv:3001;
    }

    upstream auth_backend {
        server auth_serv:3002;
    }

    server {
        listen 80;

        # Запросы, начинающиеся с /graph, идут на graph_serv
        location /graph {
            proxy_pass http://graph_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Все остальные запросы идут на auth_serv
        location / {
            proxy_pass http://auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}